[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flakey-test-detector"
version = "0.1.0"
description = "Statistical flakey test analyzer with repeat execution and variance scoring"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
flakey-test-detector = "flakey_test_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["flakey_test_detector*"]
